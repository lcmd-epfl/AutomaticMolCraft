site_name: AutomaticMolCraft
site_description: User tutorial for the AutomaticMolCraft web UI
repo_url: https://github.com/pregHosh/AutomaticMolCraftt
repo_name: pregHosh/AutomaticMolCraftt
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tooltips
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - UI Overview: ui-overview.md
  - Generation:
      - De-novo: generation/index.md
      - Structure-guided: generation/structure-guided.md
      - Presets: generation/presets.md
  - Data Manager: data-manager.md
  - Analysis Tools: analysis-tools.md
  - Visualization: visualization.md
  - Workflows: workflows/index.md
  - Model Training: training.md
  - Plug-in Tools: plugin-tools.md
  - FAQ: faq.md
