<svg
      xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
      role="img"
      aria-label="AutomaticMolCraft"
    >
      <defs>
        <linearGradient id="cosmos-amc-logo-bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0e2b3b" />
          <stop offset="52%" stop-color="#206385" />
          <stop offset="100%" stop-color="#2f99ca" />
        </linearGradient>
        <radialGradient id="cosmos-amc-logo-highlight" cx="28%" cy="22%" r="60%">
          <stop offset="0%" stop-color="#92dbfb" stop-opacity="0.4" />
          <stop offset="100%" style={{ stopColor: '#000000' }} stop-opacity="0" />
        </radialGradient>
        
        <radialGradient id="cosmos-amc-logo-atom" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#d7f2fe" />
          <stop offset="55%" stop-color="#88d7fb" />
