<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">AutomaticMolCraft</title>
  <desc id="logo-desc">Molecular flask with orbiting atoms</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#071e42"/>
      <stop offset="52%" stop-color="#0d4a80"/>
      <stop offset="100%" stop-color="#1980bc"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%"  stop-color="#72e3ff"/>
      <stop offset="100%" stop-color="#18b4e8"/>
    </linearGradient>
    <radialGradient id="bgHighlight" cx="28%" cy="22%" r="60%">
      <stop offset="0%"  stop-color="#1e78b0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#071e42" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgHighlight)"/>
  <!-- Inner border highlight -->
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.3" fill="none"
        stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>

  <!-- Orbital ring ellipse (molecular aesthetic) -->
  <ellipse cx="32" cy="36" rx="23" ry="8.5" fill="none"
           stroke="rgba(56,189,248,0.22)" stroke-width="0.9"
           stroke-dasharray="3 2.5"/>

  <!-- Orbital node dots at ellipse ends -->
  <circle cx="9"  cy="36" r="2.2" fill="#38bdf8" opacity="0.65" filter="url(#softGlow)"/>
  <circle cx="55" cy="36" r="1.7" fill="#38bdf8" opacity="0.45" filter="url(#softGlow)"/>

  <!-- Flask outline -->
  <g fill="none" stroke="rgba(220,245,255,0.92)" stroke-linecap="round"
     stroke-linejoin="round" stroke-width="3.0">
    <path d="M26 13h12"/>
    <path d="M28 13v11l-10.5 16.8A8.5 8.5 0 0 0 24.7 54h14.6a8.5 8.5 0 0 0 7.2-13.2L36 24V13"/>
  </g>

  <!-- Flask liquid -->
  <path d="M22 42.2c2.6-1.8 5.2 2.8 7.8 1.2s5.2-6 7.8-4.3 5.2 4.8 7.2 3.4
           c.2 4.5-2.4 8.8-7.2 8.8H26.4c-3.9 0-6.9-3.1-7.3-7.1z"
        fill="url(#liquidGrad)" opacity="0.90"/>
  <!-- Liquid specular highlight -->
  <path d="M24.5 43c1.8-1 3.5 1.5 5.5 0.5" fill="none"
        stroke="rgba(255,255,255,0.38)" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Bubbles — staggered sizes -->
  <circle cx="26"  cy="37"   r="1.7" fill="rgba(215,243,255,0.85)"/>
  <circle cx="31.5" cy="33.2" r="1.2" fill="rgba(215,243,255,0.75)"/>
  <circle cx="36.5" cy="37.8" r="1.45" fill="rgba(215,243,255,0.80)"/>

  <!-- Flask neck atom nodes -->
  <circle cx="28" cy="20.5" r="1.1" fill="rgba(180,230,255,0.55)"/>
  <circle cx="36" cy="20.5" r="1.1" fill="rgba(180,230,255,0.55)"/>

  <!-- Specular highlight on flask body -->
  <circle cx="27.5" cy="28" r="1.0" fill="rgba(255,255,255,0.45)"/>
</svg>
