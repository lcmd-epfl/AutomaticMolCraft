        </radialGradient>
        <radialGradient id="cosmos-amc-logo-atom-core" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="50%" stop-color="#b9e8fd" />
          <stop offset="100%" stop-color="#60caf9" />
        </radialGradient>
      </defs>

      
      <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cosmos-amc-logo-bg)" />
      <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cosmos-amc-logo-highlight)" />
      <rect
        x="2.75" y="2.75" width="58.5" height="58.5" rx="13.3" fill="none"
