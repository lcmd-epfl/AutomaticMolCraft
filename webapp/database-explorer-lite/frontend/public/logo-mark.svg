        <path d="M30 35 L21.5 50.5" stroke="#ebf2fa" stroke-opacity="0.85" stroke-width="3.4" />
        
        <path d="M33.5 37.5 L26.9 49.4" stroke="#ebf2fa" stroke-opacity="0.4" stroke-width="2" />
        
        <path
